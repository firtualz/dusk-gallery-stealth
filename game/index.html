<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night at Dusk Gallery — a stealth game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0906;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
  }
  #wrap { text-align: center; }
  canvas {
    display: block;
    width: 1280px;
    height: 800px;
    max-width: 100vw;
    max-height: 100vh;
    background: #241b12;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
  }
  p {
    color: #d6c9a8;
    font-size: 14px;
    margin: 8px 0 0;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <p>Night at Dusk Gallery — steal 3 artifacts, reach the exit unseen.</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
